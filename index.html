<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Productivity Agent</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        h1, h2, h3 { margin: 0 0 8px 0; }
        .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }

        input, select, button, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: var(--text);
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.8; }

        .advice-box {
            background: #0f172a;
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-top: 8px;
        }

        .task-item {
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .history-entry {
            border-left: 2px solid var(--muted);
            padding-left: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Header & Setup -->
    <div class="card">
        <h1>📱 Personal Productivity Agent</h1>
        <div class="subtitle" id="current-time"></div>
        <input type="password" id="api-key" placeholder="Enter Gemini API Key (Saved locally)">
        <button onclick="saveApiKey()">Save Key</button>
    </div>

    <!-- Active Workflow Card -->
    <div class="card" id="workflow-card">
        <!-- Content injected dynamically via JavaScript -->
    </div>

    <!-- History Log -->
    <div class="card">
        <h3>📜 Archived History</h3>
        <div id="history-list" class="subtitle">No archived logs yet.</div>
        <button onclick="clearHistory()" style="background:#ef4444; color:white; font-size:0.8rem; padding:6px;">Clear History</button>
    </div>

    <script>
        // State Management via localStorage
        const STORAGE_KEY_API = 'agent_gemini_key';
        const STORAGE_KEY_TASKS = 'agent_daily_tasks';
        const STORAGE_KEY_HISTORY = 'agent_history';

        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }) + ' IST';
        }
        setInterval(updateTime, 1000);
        updateTime();

        function saveApiKey() {
            const key = document.getElementById('api-key').value.trim();
            if (key) {
                localStorage.setItem(STORAGE_KEY_API, key);
                alert('API Key saved locally!');
            }
        }

        // Initialize UI on page load
        window.onload = function() {
            const savedKey = localStorage.getItem(STORAGE_KEY_API);
            if (savedKey) document.getElementById('api-key').value = savedKey;

            renderWorkflow();
            renderHistory();
        };

        function renderWorkflow() {
            const container = document.getElementById('workflow-card');
            const now = new Date();
            const hour = now.getHours();
            const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY_TASKS) || '[]');

            // Morning Mode (Before 12 PM) or if no tasks set
            if (savedTasks.length === 0) {
                container.innerHTML = `
                    <h2>🌅 Morning Routine (Set 3 MITs)</h2>
                    <div class="subtitle">What are your top 3 goals for today?</div>
                    <input type="text" id="task1" placeholder="Task 1">
                    <input type="text" id="task2" placeholder="Task 2">
                    <input type="text" id="task3" placeholder="Task 3">
                    <button onclick="submitMorningTasks()">Save Tasks & Get AI Strategy</button>
                    <div id="ai-response"></div>
                `;
            } else {
                // Evening Review Mode
                let html = `<h2>🌙 Evening Progress Review</h2><div class="subtitle">Update status for today's tasks:</div>`;
                savedTasks.forEach((t, i) => {
                    html += `
                        <div class="task-item">
                            <strong>${i+1}. ${t.task}</strong>
                            <select id="status-${i}">
                                <option value="Completed" ${t.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Not Started" ${t.status === 'Not Started' ? 'selected' : ''}>Not Started</option>
                            </select>
                            <input type="text" id="note-${i}" placeholder="Bottleneck / Note" value="${t.notes || ''}">
                        </div>
                    `;
                });
                html += `
                    <button onclick="submitEveningReview()">Submit Review & Archive</button>
                    <button onclick="resetTodayTasks()" style="background:#64748b; margin-top:4px;">Reset Today's Tasks</button>
                    <div id="ai-response"></div>
                `;
                container.innerHTML = html;
            }
        }

    async function callGeminiAPI(prompt) {
            const key = localStorage.getItem(STORAGE_KEY_API);
            if (!key) {
                alert('Please enter and save your Gemini API Key first!');
                return null;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                
                const data = await response.json();

                // Check for API Error response
                if (data.error) {
                    alert('API Error: ' + data.error.message);
                    return null;
                }

                // Safely extract generated text across response formats
                if (data.candidates && data.candidates.length > 0) {
                    const candidate = data.candidates[0];
                    if (candidate.content && candidate.content.parts && candidate.content.parts.length > 0) {
                        return candidate.content.parts[0].text;
                    }
                }

                alert('Unexpected response format from Gemini API.');
                return null;
            } catch (err) {
                alert('Connection Error: ' + err.message);
                return null;
            }
        }

        async function submitMorningTasks() {
            const t1 = document.getElementById('task1').value.trim();
            const t2 = document.getElementById('task2').value.trim();
            const t3 = document.getElementById('task3').value.trim();

            if (!t1 || !t2 || !t3) {
                alert('Please enter all 3 tasks.');
                return;
            }

            const tasks = [
                { id: 1, task: t1, status: 'Pending', notes: '' },
                { id: 2, task: t2, status: 'Pending', notes: '' },
                { id: 3, task: t3, status: 'Pending', notes: '' }
            ];

            localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(tasks));
            
            const respDiv = document.getElementById('ai-response');
            respDiv.innerHTML = '<div class="advice-box">Generating strategy...</div>';

            const prompt = `I have 3 main tasks today: ${JSON.stringify([t1, t2, t3])}. Give me a 2-sentence practical focus strategy.`;
            const advice = await callGeminiAPI(prompt);

            if (advice) {
                respDiv.innerHTML = `<div class="advice-box"><strong>Agent Advice:</strong><br>${advice}</div>`;
                setTimeout(renderWorkflow, 4000);
            }
        }

        async function submitEveningReview() {
            const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY_TASKS) || '[]');
            
            savedTasks.forEach((t, i) => {
                t.status = document.getElementById(`status-${i}`).value;
                t.notes = document.getElementById(`note-${i}`).value.trim() || (t.status === 'Completed' ? 'Done' : 'None');
            });

            // Save updated tasks
            localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(savedTasks));

            // Archive to History
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]');
            const todayStr = new Date().toISOString().split('T')[0];
            
            const existingIndex = history.findIndex(h => h.date === todayStr);
            if (existingIndex >= 0) {
                history[existingIndex].tasks = savedTasks;
            } else {
                history.push({ date: todayStr, tasks: savedTasks });
            }
            
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
            renderHistory();

            // Fetch EOD Review
            const respDiv = document.getElementById('ai-response');
            respDiv.innerHTML = '<div class="advice-box">Analyzing performance...</div>';

            const prompt = `Here is my EOD task execution summary: ${JSON.stringify(savedTasks)}. Give me a 2-sentence encouraging review and a tip for tomorrow.`;
            const advice = await callGeminiAPI(prompt);

            if (advice) {
                respDiv.innerHTML = `<div class="advice-box"><strong>EOD Analysis:</strong><br>${advice}</div>`;
            }
        }

        function resetTodayTasks() {
            if (confirm("Reset today's tasks to enter new ones?")) {
                localStorage.removeItem(STORAGE_KEY_TASKS);
                renderWorkflow();
            }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]');
            const container = document.getElementById('history-list');

            if (history.length === 0) {
                container.innerHTML = 'No archived logs yet.';
                return;
            }

            let html = '';
            history.reverse().forEach(entry => {
                html += `<div class="history-entry"><strong>${entry.date}</strong><br>`;
                entry.tasks.forEach(t => {
                    html += `• ${t.task} [${t.status}] ${t.notes ? '(' + t.notes + ')' : ''}<br>`;
                });
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function clearHistory() {
            if (confirm("Clear all archived history?")) {
                localStorage.removeItem(STORAGE_KEY_HISTORY);
                renderHistory();
            }
        }
    </script>
</body>
</html>
